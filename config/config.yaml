# Cat Agent Instagram - Configuration
# Copy to config/config.local.yaml (or set env vars) and fill in real credentials.
# Never commit real tokens to the repository.

# Local Ollama instance
ollama:
  base_url: "http://localhost:11434"
  vision_model: "qwen3-vl:8b"
  text_model: "qwen2.5"
  stream: false
  timeout_seconds: 120

# Persona configuration
personas:
  config_path: "config/personas.json"

# Meta Graph API (Instagram Creator API)
meta:
  # Graph API version, e.g. v21.0
  api_version: "v21.0"
  graph_base_url: "https://graph.facebook.com"
  # Access token for the connected Facebook Page / Instagram business account
  access_token: ""
  # Instagram business/user ID of the target account
  instagram_user_id: ""
  # Set true to prevent real publishing (safe default)
  dry_run: true

# Telegram approval gateway
telegram:
  bot_token: ""
  # Comma-separated numeric chat IDs allowed to approve/reject
  allowed_chat_ids: []
  # Optional: chat to receive "action needed" push notifications (defaults to
  # the first allowed_chat_ids)
  notify_chat_id: ""
  # Poll interval (seconds) used to wait for human decisions
  poll_interval: 5
  decision_timeout_seconds: 1800

# Human-in-the-loop alerting: sound + Telegram push when a decision is needed
approval:
  # Play a sound before blocking for a decision (false = silent / unattended)
  sound: true
  # Optional custom .wav file path; empty = system alert beep
  sound_file: ""
  # Send a Telegram "action needed" message before blocking
  notify_telegram: true

# Cat pictures media vault (archive + training corpus) and publish-time hosting
vault:
  # Local content-addressed archive mirror
  root: "data/vault"
  telegram:
    # Dedicated bot (separate token from telegram.bot_token) + private channel
    bot_token: ""
    chat_id: ""
    # Fail the pipeline when an archive upload fails (true) vs best-effort
    required: false
  host:
    # Publish-time public URLs for Meta: none | r2 | s3
    backend: "none"
    bucket: ""
    public_base_url: ""
    endpoint_url: ""
    access_key_id: ""
    secret_access_key: ""

# Pipeline behaviour
pipeline:
  input_dir: "data/input_media"
  db_path: "data/pipeline.db"
  # Require explicit human approval before publishing
  require_approval: true

# Local generative "digital twin" content (self-contained; separate from the
# photo pipeline and from Instagram/Telegram publishing)
creative:
  sets_path: "config/creative/sets.json"
  out_root: "data/generated"

# AI Video Reel pipeline: animate real vault cat photos into 9:16 clips via an
# assisted browser session on a free third-party service, then publish as Reels
# through the official Meta Graph API after human approval.
reel:
  # External image-to-video service (browser-driven; never Instagram)
  service: "pixverse"
  service_url: "https://app.pixverse.ai"
  # Persistent, gitignored Playwright profile (operator logs in once)
  browser_profile_dir: "data/.browser/reel"
  # Where the external-service selectors live (one-file repair on UI drift)
  selectors_path: "config/reel/selectors.json"
  # Headed is required for anti-bot handling + operator intervention
  headless: false
  # Bounded wait for a single clip generation (seconds)
  generation_timeout_seconds: 600
  aspect: "9:16"
  min_resolution: [540, 960]
  target_resolution: [1080, 1920]
  min_duration_seconds: 3
  max_duration_seconds: 900
  # 5-90 s to appear in the Reels tab (preferred floor)
  preferred_min_duration_seconds: 5
  max_size_mb: 300
  publish:
    # Also surface the Reel in the account feed (Meta `share_to_feed`)
    share_to_feed: true
    # FR-016: mandatory AI-generated disclosure appended to every Reel caption
    disclosure: "This Reel was generated with AI image-to-video from a real photo of our cat."
