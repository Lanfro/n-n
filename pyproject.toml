[project]
name = "cat-agent-instagram"
version = "0.1.0"
description = "Self-hosted pipeline that turns raw cat photos into approved, published Instagram posts via the Meta Graph API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "python-telegram-bot>=21.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"